; Brain Machine — firmware (Stage 1)
; Targets: Seeed XIAO ESP32-S3 (final hardware) and a classic ESP32 DevKit
; (ESP32-D / WROOM) for developing the web UI while parts are in the post.
; Fork of Mitch Altman's Brain Machine (CC BY-SA). Keep attribution.

[platformio]
default_envs = xiao_esp32s3

; ---- Shared settings for every board ----
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ; Async web stack for the self-hosted control UI
    esp32async/ESPAsyncWebServer @ ^3.1.0
    esp32async/AsyncTCP @ ^3.1.4
    ; JSON for the session model + REST API
    bblanchon/ArduinoJson @ ^7.1.0
    ; Ear PPG heart rate (MAX30102)
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; ---- Final hardware: Seeed XIAO ESP32-S3 ----
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    -DBM_BOARD_XIAO_S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2

; ---- Dev board: classic ESP32-D / WROOM DevKit (UI work now) ----
; No PSRAM flag, different pin map. Audio/PPG parts not wired yet — this env is
; for iterating the web UI, sessions, networking, and LED blink.
[env:esp32dev]
board = esp32dev
; min_spiffs: ~1.9 MB app + a filesystem partition (our UI needs LittleFS).
; Default esp32dev partition gives only 1.3 MB app, which the UI build overflows.
board_build.partitions = min_spiffs.csv
build_flags =
    -DBM_BOARD_ESP32DEV
    -DCORE_DEBUG_LEVEL=2
