; Brain Machine — firmware (Stage 1)
; Target: Seeed XIAO ESP32-S3
; Fork of Mitch Altman's Brain Machine (CC BY-SA). Keep attribution.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Async web stack for the self-hosted control UI
    esp32async/ESPAsyncWebServer @ ^3.1.0
    esp32async/AsyncTCP @ ^3.1.4
    ; JSON for the session model + REST API
    bblanchon/ArduinoJson @ ^7.1.0
    ; Ear PPG heart rate (MAX30102)
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
